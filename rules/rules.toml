# RustGate 规则配置
# score_threshold: 单个请求命中规则累计分数 >= 该阈值时拦截
score_threshold = 20

# CC 限流（令牌桶）：每 IP 桶容量 / 每秒补充速率
cc_capacity = 100
cc_refill_per_sec = 10

#
# -- 规则条目 --
# field 可选: Url | Args | Header | Body | Method
# pattern 为字面量时由 aho-corasick(Aho-Corasick 自动机) 多模式匹配，
# 以 "regex:" 前缀开头时走 regex 正则匹配。
#
# field = "Header" 时可选加 header = "User-Agent"/"Cookie"/"Referer" 等，
# 表示只匹配该名称的 header；不填则匹配所有 header 的拼接串。
#
# -- 计分设计（阈值 20）--
# * 决定性特征（union select、${jndi:、webshell 函数等）：单条 20~25 分，一击拦截；
# * 弱信号（后台路径探测、备份文件后缀等）：单条 10~15 分，
#   需与其它信号叠加才到阈值，降低正常业务误杀；
# * Url 字段 = path + query（已解码），Args = 仅 query，Body = 请求体前缀；
#   同一攻击出现在不同字段（如 SQLi 在 query/body/path）分别建规则覆盖。
#
# -- 规则参考来源 --
# * OWASP CRS (coreruleset.org)：攻击分类与阈值设计思路
# * PayloadsAllTheThings：各攻击类型的真实 payload 特征
# * SecLists：扫描器 User-Agent / 敏感路径字典
#

# ============================================================
# SQL 注入（sqli）
# ============================================================

[[rules]]
id = 1
name = "SQLi: union select"
category = "sqli"
field = "Args"
pattern = "union select"
score = 20

[[rules]]
id = 2
name = "SQLi: 内部注释绕过"
category = "sqli"
field = "Args"
pattern = "regex:(?i)(\\bor\\b|\\band\\b)\\s+\\d+\\s*=\\s*\\d+"
score = 20

[[rules]]
id = 3
name = "SQLi: 单引号恒真"
category = "sqli"
field = "Args"
pattern = "regex:(?i)'\\s*or\\s*'1'='1"
score = 20

[[rules]]
id = 10
name = "SQLi: union select（请求体）"
category = "sqli"
field = "Body"
pattern = "union select"
score = 20

[[rules]]
id = 11
name = "SQLi: union select（路径）"
category = "sqli"
field = "Url"
pattern = "union select"
score = 20

[[rules]]
id = 12
name = "SQLi: 注释混淆 union/**/select"
category = "sqli"
field = "Args"
pattern = "regex:(?i)\\bunion[\\s/*]{1,16}select\\b"
score = 25

[[rules]]
id = 13
name = "SQLi: union all select"
category = "sqli"
field = "Args"
pattern = "union all select"
score = 25

[[rules]]
id = 14
name = "SQLi: 时间盲注（query）"
category = "sqli"
field = "Args"
pattern = "regex:(?i)\\b(sleep|benchmark|pg_sleep|waitfor\\s+delay)\\s*\\("
score = 20

[[rules]]
id = 15
name = "SQLi: 时间盲注（body）"
category = "sqli"
field = "Body"
pattern = "regex:(?i)\\b(sleep|benchmark|pg_sleep|waitfor\\s+delay)\\s*\\("
score = 20

[[rules]]
id = 16
name = "SQLi: 报错注入 extractvalue/updatexml"
category = "sqli"
field = "Args"
pattern = "regex:(?i)\\b(extractvalue|updatexml)\\s*\\("
score = 20

[[rules]]
id = 17
name = "SQLi: 堆叠查询/破坏性语句"
category = "sqli"
field = "Args"
pattern = "regex:(?i);\\s*(drop|delete|insert|update|truncate)\\b"
score = 25

[[rules]]
id = 18
name = "SQLi: information_schema 系统表探测"
category = "sqli"
field = "Args"
pattern = "information_schema"
score = 20

[[rules]]
id = 19
name = "NoSQL 注入: $where/$ne/$gt/$regex 操作符"
category = "nosqli"
field = "Args"
pattern = "regex:(?i)\\$where|\\$ne\\s*:|\\$gt\\s*:|\\$regex\\s*:"
score = 20

