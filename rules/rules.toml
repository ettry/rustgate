# ============================================================
# 路径穿越 / LFI / 信息泄露（traversal / lfi）
# ============================================================

[[rules]]
id = 5
name = "路径穿越"
category = "traversal"
field = "Url"
pattern = "regex:\\.\\.(/|%2f|%5c)"
score = 20

[[rules]]
id = 31
name = "LFI: 敏感系统文件读取"
category = "lfi"
field = "Url"
pattern = "regex:(?i)/etc/(passwd|shadow|group|hosts)|/proc/self|c:\\\\+windows|win\\.ini|boot\\.ini"
score = 25

[[rules]]
id = 32
name = "LFI: PHP 流包装器/文件协议"
category = "lfi"
field = "Url"
pattern = "regex:(?i)(php|data|expect|zip|phar|file)://"
score = 25

[[rules]]
id = 33
name = "信息泄露: .git/.svn/.hg 目录"
category = "lfi"
field = "Url"
pattern = "regex:(?i)/\\.(git|svn|hg)(/|$)"
score = 25

# ============================================================
# RCE / SSTI / 反序列化 / 模板注入（rce）
# ============================================================

[[rules]]
id = 40
name = "Log4Shell: JNDI 注入（query）"
category = "rce"
field = "Args"
pattern = "${jndi:"
score = 25

[[rules]]
id = 41
name = "Log4Shell: JNDI 注入（body）"
category = "rce"
field = "Body"
pattern = "${jndi:"
score = 25

[[rules]]
id = 42
name = "Log4Shell: JNDI 注入（任意 header）"
category = "rce"
field = "Header"
pattern = "${jndi:"
score = 25

[[rules]]
id = 43
name = "SSTI: ${7*7} 模板探测（query）"
category = "ssti"
field = "Args"
pattern = "${7*7}"
score = 20

[[rules]]
id = 44
name = "SSTI: ${7*7} 模板探测（body）"
category = "ssti"
field = "Body"
pattern = "${7*7}"
score = 20

[[rules]]
