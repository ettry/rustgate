[[rules]]
id = 48
name = "反序列化: Java 序列化魔术头 rO0AB"
category = "rce"
field = "Body"
pattern = "rO0AB"
score = 25

[[rules]]
id = 49
name = "Webshell: Java Runtime 执行"
category = "rce"
field = "Body"
pattern = "Runtime.getRuntime"
score = 20

# ============================================================
# SSRF（ssrf）
# ============================================================

[[rules]]
id = 50
name = "SSRF: 内网/云元数据地址（query）"
category = "ssrf"
field = "Args"
pattern = "regex:(?i)https?://(127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0|169\\.254\\.169\\.254|metadata\\.google\\.internal|\\[::1\\])"
score = 25

[[rules]]
id = 51
name = "SSRF: 内网/云元数据地址（body）"
category = "ssrf"
field = "Body"
pattern = "regex:(?i)https?://(127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0|169\\.254\\.169\\.254|metadata\\.google\\.internal|\\[::1\\])"
score = 25

# ============================================================
# 命令注入（cmdi）
# ============================================================

[[rules]]
id = 7
name = "命令注入: 管道/分号拼接"
category = "cmdi"
field = "Args"
pattern = "regex:(?i)([;&|]|\\$\\()\\s*(cat|ls|id|whoami|pwd|wget|curl|nc|sh|bash|echo|rm|touch|ping|nslookup)"
score = 25

[[rules]]
id = 8
name = "命令注入: 反引号执行"
category = "cmdi"
field = "Args"
pattern = "regex:(?i)`[a-z0-9_\\- ]+`"
score = 25

[[rules]]
id = 9
name = "命令注入: 常见命令关键字"
category = "cmdi"
field = "Body"
pattern = "regex:(?i)\\b(cat|/etc/passwd|whoami|ls\\s+-la|wget\\s+http|curl\\s+http)\\b"
score = 25

# ============================================================
# 扫描器识别 / 敏感路径探测（scanner）
# ============================================================

[[rules]]
id = 60
name = "扫描器: 攻击工具 User-Agent"
category = "scanner"
field = "Header"
header = "User-Agent"
pattern = "regex:(?i)\\b(sqlmap|nikto|nmap|masscan|zgrab|dirbuster|gobuster|wpscan|acunetix|nessus|havij|w3af|arachni|whatweb|openvas|qualys|feroxbuster)\\b"
score = 25

[[rules]]
id = 61
name = "探测: 敏感配置/密钥文件"
category = "scanner"
field = "Url"
pattern = "regex:(?i)/(\\.env|\\.aws/credentials|\\.htaccess|\\.htpasswd|\\.DS_Store|\\.bash_history|id_rsa|\\.ssh/)"
score = 25

[[rules]]
id = 62
name = "探测: CMS 后台/框架调试路径"
category = "scanner"
field = "Url"
pattern = "regex:(?i)/(wp-login\\.php|wp-admin|xmlrpc\\.php|phpmyadmin|administrator|vendor/phpunit|actuator)"
score = 15

[[rules]]
id = 63
name = "探测: 备份/导出文件后缀"
category = "scanner"
field = "Url"
pattern = "regex:(?i)\\.(bak|backup|old|orig|save|swp|sql|dump)\\b"
score = 15

